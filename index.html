<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Proyecto Web - Google Maps</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      max-width: 800px; 
      margin: 20px auto; 
      padding: 0 15px; 
      line-height: 1.6; 
      color: #333;
    }
    .perfil { 
      text-align: center; 
      margin-bottom: 30px; 
    }
    .perfil img { 
      width: 140px; 
      height: 140px; 
      border-radius: 50%; 
      object-fit: cover; 
      border: 3px solid #0055aa; 
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    .instruccion-mapa {
      font-size: 0.9em;
      color: #666;
      margin-top: -5px;
      margin-bottom: 10px;
    }
    .mapa-contenedor { 
      height: 450px; 
      width: 100%; 
      margin-top: 10px; 
      border: 1px solid #ccc; 
      border-radius: 8px;
    }
    iframe { 
      width: 100%; 
      height: 450px; 
      border: 0; 
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- DATOS PERSONALES -->
  <section class="perfil">
    <img src="foto.jpg" alt="Fotografía de Alejandro Velázquez">
    <h1>Alejandro Velázquez Hernández</h1>
    <p>Ingeniería en Tecnologías de la Información e Innovación Digital</p>
  </section>

  <hr>

  <!-- ETAPA 1: MAPA CON IFRAME (UPVM - DIVISIÓN DE INGENIERÍA EN TI) -->
  <section>
    <h2>Ubicación - Cómo llegar (Iframe)</h2>
    <iframe 
      src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3759.043681404179!2d-99.12973868509102!3d19.64214978676572!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x85d1f471e95e8657%3A0xbce5c7924e65ecaa!2sDivisi%C3%B3n%20de%20Ingenieria%20en%20Tecnologias%20de%20la%20Informaci%C3%B3n!5e0!3m2!1ses-419!2smx!4v1710000000000!5m2!1ses-419!2smx" 
      allowfullscreen="" 
      loading="lazy" 
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </section>

  <hr>

  <!-- ETAPA 3: MAPA INTERACTIVO CON JAVASCRIPT -->
  <section>
    <h2>Ubicación Interactiva (Maps JavaScript API)</h2>
    <p class="instruccion-mapa">💡 <em>Haz clic en cualquier punto del mapa o arrastra el marcador rojo para cambiar la ubicación.</em></p>
    <div id="mapa" class="mapa-contenedor"></div>
  </section>

  <script>
    function initMap() {
      // Coordenadas exactas de la División de TI en la UPVM
      const ubicacionUPVM = { lat: 19.64215, lng: -99.12755 };

      const mapa = new google.maps.Map(document.getElementById("mapa"), {
        zoom: 17,
        center: ubicacionUPVM,
      });

      // Marcador arrastrable posicionado en la facultad
      const marcador = new google.maps.Marker({
        position: ubicacionUPVM,
        map: mapa,
        draggable: true,
        title: "División de Ingeniería en Tecnologías de la Información - UPVM",
        animation: google.maps.Animation.DROP
      });

      // Ventana de información interactiva
      const infoWindow = new google.maps.InfoWindow({
        content: "<strong>UPVM</strong><br>División de Tecnologías de la Información e Innovación Digital."
      });

      marcador.addListener("click", () => {
        infoWindow.open(mapa, marcador);
      });

      // Permite reubicar el marcador con un clic en el mapa
      mapa.addListener("click", (evento) => {
        marcador.setPosition(evento.latLng);
      });
    }
  </script>

  <!-- LLAMADA A LA API CON TU CLAVE REAL RESTRINGIDA -->
  <script 
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyDlUO8ImsAqnTI0Yi2e2L6Dx0kF19-jdMY&callback=initMap" 
    async 
    defer>
  </script>

</body>
</html>
